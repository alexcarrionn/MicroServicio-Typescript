name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # leer el código (checkout)

jobs:
  validate-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # solo validar; los PR desde forks reciben un token de solo lectura
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["feat","fix","docs","test","ci","build","refactor","perf","style","chore","revert"]'
          add_label: "false"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Comprobar formato
        run: npm run format:check
      - name: Lint
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Tests con cobertura
        run: npm run test:coverage
      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Compilar TypeScript
        run: npm run build
      - name: Subir build
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: microservicio-typescript:ci
      CONTAINER: api-ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # misma imagen que publica release.yml, pero solo se carga en el runner
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar el contenedor
        run: docker run -d --name "$CONTAINER" -p 3000:3000 "$IMAGE"

      # el HEALTHCHECK del Dockerfile decide cuándo está listo el servicio
      - name: Esperar a que el contenedor esté healthy
        run: |
          for i in $(seq 1 45); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
            echo "Intento $i: $estado"
            [ "$estado" = "healthy" ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" = "true" ] || break
            sleep 2
          done
          echo "::error::El contenedor no ha llegado a healthy"
          exit 1

      - name: Comprobar que no se ejecuta como root
        run: |
          uid=$(docker exec "$CONTAINER" id -u)
          echo "UID dentro del contenedor: $uid"
          [ "$uid" != "0" ] || { echo "::error::El contenedor se ejecuta como root"; exit 1; }

      - name: Prueba de humo de la API
        run: sh scripts/comprobar-api.sh http://localhost:3000

      - name: Logs del contenedor
        if: failure()
        run: docker logs "$CONTAINER"

      - name: Parar el contenedor
        if: always()
        run: docker rm -f "$CONTAINER" || true
