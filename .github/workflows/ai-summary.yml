name: Resumen con IA

# En cada pull request, una IA de GitHub Models resume en lenguaje natural
# qué cambia y lo publica como comentario en el PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ai-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # para comentar en el PR
  models: read # para llamar a GitHub Models con el GITHUB_TOKEN

env:
  AI_MODEL: openai/gpt-4o-mini

jobs:
  resumen:
    # los PRs desde forks (otros grupos) no reciben secretos ni permiso para comentar
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pedir el resumen a la IA
        env:
          # GitHub Models usa el token del propio workflow, sin secretos extra
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          fallo() { echo "::warning::$1"; echo "La IA ha fallado" > resumen.md; exit 0; }

          # el diff se recorta para no superar el contexto del modelo
          git diff --stat "$BASE_SHA" "$HEAD_SHA" > cambios.txt
          # sin tubería: si head cortara la salida de git diff, pipefail haría fallar el paso
          git diff "$BASE_SHA" "$HEAD_SHA" > diff-completo.txt
          head -c 60000 diff-completo.txt >> cambios.txt

          jq -n --arg model "$AI_MODEL" --rawfile diff cambios.txt '{
            model: $model,
            messages: [
              { role: "system",
                content: "Eres un revisor de código. Resume en español, en lenguaje natural y en menos de 200 palabras, qué cambia este pull request y por qué importa. Usa Markdown con una lista breve. No inventes nada que no esté en el diff." },
              { role: "user", content: $diff }
            ]
          }' > peticion.json

          curl -sS --fail --max-time 300 https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @peticion.json -o respuesta.json \
            || fallo "La llamada a GitHub Models ha fallado"

          jq -er '.choices[0].message.content | select(length > 0)' respuesta.json > texto.md \
            || fallo "La respuesta de la IA no tiene contenido"

          { echo "### Resumen de cambios generado por IA ($AI_MODEL)"; echo; cat texto.md; } > resumen.md

      - name: Comentar en el PR
        if: always() # aunque el paso anterior rompa, el PR recibe el aviso
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # reutiliza el comentario anterior del bot para no llenar el PR de comentarios
        run: |
          [ -s resumen.md ] || echo "La IA ha fallado" > resumen.md
          gh pr comment "$PR" --body-file resumen.md --edit-last --create-if-none
