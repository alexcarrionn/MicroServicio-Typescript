name: Resumen con IA

# En cada pull request, una IA de Groq resume en lenguaje natural
# qué cambia y lo publica como comentario en el PR.
#
# Usa pull_request_target para que también funcione con PRs desde forks:
# se ejecuta el workflow de la rama base, con secretos y permiso para comentar.
# AVISO DE SEGURIDAD: este workflow NUNCA debe ejecutar código del PR
# (nada de npm ci, builds, tests ni scripts del fork) ni interpolar datos
# del PR (título, cuerpo, nombre de rama) con ${{ }} dentro de un run:.
# El código del PR solo se lee con git diff y se envía como texto a la IA.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: ai-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # para comentar en el PR

env:
  AI_MODEL: openai/gpt-oss-120b

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # se hace checkout de la rama base (por defecto en pull_request_target)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # trae los commits del PR (también si vienen de un fork) solo para el diff
      - name: Traer los commits del PR
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/$PR/head"

      - name: Pedir el resumen a la IA
        env:
          # el token vive en un secreto del repositorio, nunca en el código
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          fallo() { echo "::warning::$1"; echo "La IA ha fallado" > resumen.md; exit 0; }

          [ -n "$GROQ_API_KEY" ] || fallo "No está definido el secreto GROQ_API_KEY"

          # el diff se recorta para no superar el contexto del modelo
          git diff --stat "$BASE_SHA" "$HEAD_SHA" > cambios.txt
          # sin tubería: si head cortara la salida de git diff, pipefail haría fallar el paso
          git diff "$BASE_SHA" "$HEAD_SHA" > diff-completo.txt
          head -c 60000 diff-completo.txt >> cambios.txt

          jq -n --arg model "$AI_MODEL" --rawfile diff cambios.txt '{
            model: $model,
            messages: [
              { role: "system",
                content: "Eres un revisor de código. Resume en español, en lenguaje natural y en menos de 200 palabras, qué cambia este pull request y por qué importa. Usa Markdown con una lista breve. No inventes nada que no esté en el diff." },
              { role: "user", content: $diff }
            ]
          }' > peticion.json

          curl -sS --fail --max-time 300 https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @peticion.json -o respuesta.json \
            || fallo "La llamada a Groq ha fallado"

          jq -er '.choices[0].message.content | select(length > 0)' respuesta.json > texto.md \
            || fallo "La respuesta de la IA no tiene contenido"

          { echo "### Resumen de cambios generado por IA ($AI_MODEL)"; echo; cat texto.md; } > resumen.md

      - name: Comentar en el PR
        if: always() # aunque el paso anterior rompa, el PR recibe el aviso
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # reutiliza el comentario anterior del bot para no llenar el PR de comentarios
        run: |
          [ -s resumen.md ] || echo "La IA ha fallado" > resumen.md
          gh pr comment "$PR" --body-file resumen.md --edit-last --create-if-none
